name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # До этапа 6 (свой домен) сайт открывается по адресу urban-factory.github.io/urbanfactory/.
      # После подключения urbanfactory.agency: SITE_URL=https://urbanfactory.agency, BASE_PATH=/
      SITE_URL: https://urban-factory.github.io
      BASE_PATH: /urbanfactory
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v5
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
